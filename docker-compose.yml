services:
  db:
    image: postgres:16-alpine
    container_name: smsp-postgres
    environment:
      POSTGRES_USER: smsp
      POSTGRES_PASSWORD: smsp
      POSTGRES_DB: smsp
    ports:
      - "5432:5432"
    volumes:
      - smsp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsp -d smsp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smsp_pgdata:
